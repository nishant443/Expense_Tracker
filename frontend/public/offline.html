<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · ExpenseFlow</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #F7F8FA; color: #111827; }
      @media (prefers-color-scheme: dark) { body { background: #0B0F19; color: #F9FAFB; } p { color: #9CA3AF !important; } }
      .card { text-align: center; padding: 32px; max-width: 320px; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #6B7280; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
      .btn { display: inline-block; background: #2563EB; color: #fff; text-decoration: none; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="" />
      <h1>You're offline</h1>
      <p>ExpenseFlow couldn't load this page. Check your connection — your saved data is safe on this device.</p>
      <a class="btn" href="/">Try again</a>
    </div>
  </body>
</html>
